name: V2EX 每日签到

on:
  schedule:
    # UTC 13:00（北京时间 21:00）触发，随后随机延迟 0~3 小时
    # 北京 09:00 对应 UTC 01:00，可改为 '0 1 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2ex-daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: python -m pip install --disable-pip-version-check requests

      - name: 随机延迟
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          DELAY=$(shuf -i 0-10800 -n 1)
          echo "随机延迟 ${DELAY} 秒（约 $((DELAY / 60)) 分钟），签到窗口为北京时间 21:00 至次日 00:00"
          sleep "$DELAY"

      - name: 执行签到
        env:
          # 单账号使用 V2EX_COOKIE；多账号使用 V2EX_ACCOUNTS JSON 数组
          V2EX_COOKIE: ${{ secrets.V2EX_COOKIE }}
          V2EX_ACCOUNTS: ${{ secrets.V2EX_ACCOUNTS }}

          # Telegram 通知（可选）
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          # 企业微信应用通知（可选）
          # 示例：WECOM_APPS='[{"corp_id":"wwxxxx","corp_secret":"xxxxx","agent_id":1000002,"thumb_media_id":"MEDIA_ID","to_user":"@all"}]'
          WECOM_APPS: ${{ secrets.WECOM_APPS }}

        run: python v2ex_checkin.py
